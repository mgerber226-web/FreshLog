<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FreshLog | The King and Queen</title>
<style>
:root {
--bg-dark: #0b1329;
--card-bg: #131d3d;
--card-border: #1e2d5c;
--primary: #10b981;
--primary-hover: #059669;
--text-main: #f8fafc;
--text-muted: #94a3b8;
--danger: #ef4444;
--warning: #f59e0b;
--safe: #10b981;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
-webkit-tap-highlight-color: transparent;
}

body {
background-color: var(--bg-dark);
color: var(--text-main);
min-height: 100vh;
display: flex;
flex-direction: column;
padding-bottom: 220px; /* space for fixed bottom intake bar */
}

header {
background: var(--card-bg);
border-bottom: 1px solid var(--card-border);
padding: 12px 16px;
display: flex;
flex-direction: column;
gap: 10px;
}

.header-top {
display: flex;
justify-content: space-between;
align-items: center;
}

.brand-area {
display: flex;
align-items: center;
gap: 10px;
}

.logo-box {
background: var(--primary);
color: #fff;
font-weight: 800;
font-size: 14px;
padding: 6px 10px;
border-radius: 6px;
letter-spacing: 0.5px;
}

.app-title h1 {
font-size: 16px;
font-weight: 700;
}

.app-title p {
font-size: 11px;
color: var(--text-muted);
}

.chef-selector {
display: flex;
align-items: center;
gap: 6px;
font-size: 12px;
background: rgba(255,255,255,0.05);
padding: 4px 8px;
border-radius: 6px;
border: 1px solid var(--card-border);
color: var(--text-main);
}

.chef-selector select {
background: transparent;
color: var(--text-main);
border: none;
font-weight: 600;
outline: none;
font-size: 12px;
}

.settings-bar {
display: flex;
justify-content: space-between;
align-items: center;
background: rgba(0,0,0,0.2);
padding: 6px 10px;
border-radius: 6px;
font-size: 12px;
}

.toggle-switch {
display: flex;
align-items: center;
gap: 8px;
cursor: pointer;
}
